<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя музыка · NOTBAD GUITAR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Стили для страницы музыки */
    .music-page {
      max-width: 800px;
      width: 100%;
      padding: 2rem 1.5rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 2rem;
      transition: 0.3s;
    }

    .back-link:hover {
      color: white;
    }

    .music-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .track-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius: 1rem;
      padding: 0.8rem;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: 0.3s;
    }

    .track-card:hover {
      background: rgba(255,255,255,0.15);
      transform: translateY(-2px);
    }

    .track-cover {
      width: 60px;
      height: 60px;
      border-radius: 0.5rem;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info {
      flex: 1;
      text-align: left;
    }

    .track-title {
      color: white;
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.2rem;
    }

    .track-artist {
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
    }

    .track-play {
      color: white;
      font-size: 1.5rem;
      opacity: 0.7;
      transition: 0.3s;
    }

    .track-card:hover .track-play {
      opacity: 1;
    }

    /* Плеер */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 1rem;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    @media (max-width: 600px) {
      .track-cover {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>
<body>
  <div class="taplink-card music-page">
    <a href="index.html" class="back-link">
      <i class="fas fa-arrow-left"></i> На главную
    </a>

    <h1 style="margin-bottom:1.5rem;">🎵 Моя музыка</h1>

    <div class="music-grid" id="musicGrid">
      <!-- Треки добавляются через JS -->
    </div>
  </div>

  <!-- Плеер -->
  <div class="player-bar" id="playerBar" style="display:none;">
    <img id="playerCover" src="" alt="" style="width:40px;height:40px;border-radius:6px;object-fit:cover;">
    <div style="flex:1;text-align:left;">
      <div id="playerTitle" style="color:white;font-weight:600;font-size:0.9rem;"></div>
      <div id="playerArtist" style="color:rgba(255,255,255,0.5);font-size:0.8rem;"></div>
    </div>
    <button id="playerBtn" style="background:none;border:none;color:white;font-size:1.5rem;cursor:pointer;">
      <i class="fas fa-pause"></i>
    </button>
  </div>

  <script>
    // Треки
    const tracks = [
      { title: "Название трека 1", artist: "Игорь", cover: "image/covers/cover1.jpg", url: "music/track1.mp3" },
      { title: "Название трека 2", artist: "Игорь", cover: "image/covers/cover2.jpg", url: "music/track2.mp3" },
      { title: "Название трека 3", artist: "Игорь", cover: "image/covers/cover3.jpg", url: "music/track3.mp3" },
      // Добавьте свои треки
    ];

    const musicGrid = document.getElementById('musicGrid');
    const playerBar = document.getElementById('playerBar');
    const playerCover = document.getElementById('playerCover');
    const playerTitle = document.getElementById('playerTitle');
    const playerArtist = document.getElementById('playerArtist');
    const playerBtn = document.getElementById('playerBtn');
    
    let currentAudio = null;
    let currentIndex = -1;

    // Создаём карточки треков
    tracks.forEach((track, index) => {
      const card = document.createElement('div');
      card.className = 'track-card';
      card.innerHTML = `
        <img src="${track.cover}" alt="${track.title}" class="track-cover" onerror="this.src='image/covers/default.jpg'">
        <div class="track-info">
          <div class="track-title">${track.title}</div>
          <div class="track-artist">${track.artist}</div>
        </div>
        <div class="track-play"><i class="fas fa-play"></i></div>
      `;
      
      card.addEventListener('click', () => playTrack(index));
      musicGrid.appendChild(card);
    });

    function playTrack(index) {
      if (currentAudio) {
        currentAudio.pause();
      }
      
      if (currentIndex === index) {
        currentIndex = -1;
        playerBar.style.display = 'none';
        return;
      }
      
      currentAudio = new Audio(tracks[index].url);
      currentIndex = index;
      
      playerCover.src = tracks[index].cover;
      playerTitle.textContent = tracks[index].title;
      playerArtist.textContent = tracks[index].artist;
      playerBar.style.display = 'flex';
      
      currentAudio.play();
      playerBtn.innerHTML = '<i class="fas fa-pause"></i>';
      
      currentAudio.onended = () => {
        playerBtn.innerHTML = '<i class="fas fa-play"></i>';
      };
    }

    playerBtn.addEventListener('click', () => {
      if (currentAudio.paused) {
        currentAudio.play();
        playerBtn.innerHTML = '<i class="fas fa-pause"></i>';
      } else {
        currentAudio.pause();
        playerBtn.innerHTML = '<i class="fas fa-play"></i>';
      }
    });
  </script>
</body>
</html>
